[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocadig"
version = "0.1.0"
description = "Personal Vocaloid music discovery backend"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]